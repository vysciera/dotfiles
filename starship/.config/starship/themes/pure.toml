palette = "flexoki"
add_newline = true

format = """
$directory\
$git_branch\
$git_status\
$line_break\
$character"""

right_format = "$cmd_duration$status"

[palettes.flexoki]
bg      = "#100F0F"
text    = "#CECDC3"
muted   = "#878580"
faint   = "#575653"
red     = "#D14D41"
orange  = "#DA702C"
yellow  = "#D0A215"
green   = "#879A39"
cyan    = "#3AA99F"
blue    = "#4385BE"
purple  = "#8B7EC8"
magenta = "#CE5D97"

[directory]
style = "text"
format = "[$path]($style) "

[git_branch]
symbol = ""
style = "muted"
format = "[$branch]($style) "

[git_status]
format = "[$all_status$ahead_behind]($style)"
style = "yellow"
modified = "~${count}"
staged = "+${count}"
untracked = "?${count}"
deleted = "×${count}"
renamed = "»${count}"
ahead = "⇡${count}"
behind = "⇣${count}"

[character]
success_symbol = "[❯](text)"
error_symbol = "[❯](red)"

[cmd_duration]
min_time = 2000
style = "muted"
format = "[$duration]($style)"

[status]
disabled = false
style = "red"
format = "[ exit $status]($style)"
