colourful: true

filekinds:
  normal:
    foreground: "#CECDC3"

  directory:
    foreground: "#5B8FC4"
    is_bold: true

  symlink:
    foreground: "#4CB4AB"
    is_bold: true
    is_underline: true

  executable:
    foreground: "#879A39"
    is_bold: true

  pipe:
    foreground: "#D0A215"

  socket:
    foreground: "#9A8DD0"

  block_device:
    foreground: "#DA702C"

  char_device:
    foreground: "#DA702C"

  special:
    foreground: "#CE5D97"

symlink_path:
  foreground: "#878580"

broken_symlink:
  foreground: "#D14D41"
  is_bold: true

broken_path_overlay:
  foreground: "#D14D41"
  is_underline: true

punctuation:
  foreground: "#5E6068"

users:
  user_you:
    foreground: "#CECDC3"

  user_root:
    foreground: "#D14D41"
    is_bold: true

  user_other:
    foreground: "#878580"

  group_yours:
    foreground: "#878580"

  group_other:
    foreground: "#5E6068"

  group_root:
    foreground: "#D14D41"

date:
  foreground: "#878580"

size:
  major:
    foreground: "#CECDC3"

  minor:
    foreground: "#878580"

  number_byte:
    foreground: "#878580"

  number_kilo:
    foreground: "#878580"

  number_mega:
    foreground: "#D0A215"

  number_giga:
    foreground: "#DA702C"

  number_huge:
    foreground: "#D14D41"

git:
  new:
    foreground: "#4CB4AB"

  modified:
    foreground: "#D0A215"

  deleted:
    foreground: "#D14D41"

  renamed:
    foreground: "#5B8FC4"

  typechange:
    foreground: "#9A8DD0"

  ignored:
    foreground: "#5E6068"
    is_dimmed: true

  conflicted:
    foreground: "#D14D41"
    is_bold: true
